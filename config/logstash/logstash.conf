input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [fields][service] {
    mutate {
      add_tag => ["service-log"]
    }
  }

  if [log][file][path] {
    mutate {
      add_field => {
        "service_name" => "%{[fields][service]}"
      }
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "circleguard-logs-%{+YYYY.MM.dd}"
    ecs_compatibility => disabled
  }
  stdout {
    codec => rubydebug
  }
}
