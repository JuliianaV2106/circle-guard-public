jwt:
  secret: "my-super-secret-test-key-that-is-32-chars-long!!"
  expiration: 3600000
 
spring:
  main:
    # Permite que los @MockBean sobreescriban beans reales en los tests
    allow-bean-definition-overriding: true
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # No arranca los consumidores -> no requiere un broker Kafka corriendo
      auto-startup: false
    consumer:
      group-id: notification-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer